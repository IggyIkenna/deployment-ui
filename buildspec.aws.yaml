# AWS CodeBuild — deployment-ui (dispatch only; NO standalone image)
#
# deployment-ui has NO standalone container image on either cloud. Its SPA is bundled INTO the
# deployment-api image: deployment-api's build clones deployment-ui into ./ui and its Dockerfile
# Stage 0 builds the SPA into ./ui/dist. So a deployment-ui change reaches AWS by rebuilding
# deployment-api.
#
# This mirrors GCP's `deployment-ui-main-deploy` trigger, whose only step is
# `gcloud builds triggers run deployment-api-main-deploy` — i.e. it dispatches the deployment-api
# build rather than building deployment-ui itself.
#
# Requires codebuild:StartBuild on the deployment-api project (granted to unified-trading-codebuild-role).

version: 0.2

phases:
  build:
    commands:
      - echo "deployment-ui ships inside the deployment-api image — dispatching a deployment-api build"
      - aws codebuild start-build --project-name deployment-api --source-version main --region "$AWS_DEFAULT_REGION" --query 'build.id' --output text
      - echo "Dispatched deployment-api build (the deployment-ui SPA is rebundled there)."
