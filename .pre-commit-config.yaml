# Canonical pre-commit config for TypeScript/React UI repos.
# Template SSOT: unified-trading-pm/scripts/pre-commit-templates/
# Rollout: bash unified-trading-pm/scripts/propagation/rollout-pre-commit-configs.sh
# Setup: pre-commit install --install-hooks

default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  # Conventional commit validation (feat:/fix:/chore:/docs:/refactor:/test:/ci:)
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.2.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  # Branch drift check - blocks commit if you're behind origin
  - repo: local
    hooks:
      - id: check-branch-drift
        name: Check branch drift (are you behind origin?)
        entry:
          bash -c 'HOOK="${WORKSPACE_ROOT:-$(cd "$(git rev-parse --show-toplevel)/.." &&
          pwd)}/unified-trading-pm/scripts/hooks/check-branch-drift.sh"; [ -f "$HOOK" ] && bash "$HOOK" || exit 0'
        language: system
        always_run: true
        pass_filenames: false
        fail_fast: true  # behind-origin -> STOP before any formatter mutates (no reflow residue that breaks slot FF-sync)

  # Prettier - auto-stage wrapper (see docs.pre-commit-config.yaml for rationale).
  - repo: local
    hooks:
      - id: prettier-autostage
        name: Format with Prettier (auto-stage)
        entry:
          bash -c 'HOOK="${WORKSPACE_ROOT:-$(cd "$(git rev-parse --show-toplevel)/.." &&
          pwd)}/unified-trading-pm/scripts/hooks/prettier-autostage.sh"; [ -f "$HOOK" ] && bash "$HOOK" "$@" || exit 0'
          --
        language: system
        types_or: [javascript, jsx, ts, tsx, json, css, markdown, yaml]

  # ESLint - TypeScript/React linter
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.56.0
    hooks:
      - id: eslint
        name: Lint with ESLint
        types_or: [javascript, jsx, ts, tsx]

  # Secret scanning — gitleaks (catches GCP SA keys, GitHub PATs, API keys)
  # Config SSOT: unified-trading-pm/.gitleaks.toml (propagated here at rollout)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.27.2
    hooks:
      - id: gitleaks
        name: Detect secrets with gitleaks
        args: ["--config", ".gitleaks.toml"]

  # Basic file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
