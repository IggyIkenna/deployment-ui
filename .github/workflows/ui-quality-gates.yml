name: ui-quality-gates

# Local reusable workflow — within-repo copy of the PM template.
# Cross-repo reusable workflow calls don't work between private user repos
# (only works in GitHub organizations). This local copy is the workaround.
# SSOT: IggyIkenna/unified-trading-pm/.github/workflows/ui-quality-gates.yml
#
# 2026-05-28 (item 14 of human_work_backlog): GH_PAT is fetched from GCP Secret Manager at
# workflow runtime, not from GHA secrets. The caller passes GCP_SA_KEY (which the repo HAS as
# a GHA secret); this workflow auths to GCP + reads GH_PAT from `projects/central-element-323112/
# secrets/GH_PAT`. Operator policy: GH_PAT lives in SM exclusively, never in GHA secrets.

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version
        type: string
        default: "22"
    secrets:
      GCP_SA_KEY:
        required: true
        description: GCP service account JSON used to fetch GH_PAT from Secret Manager
      TELEGRAM_BOT_TOKEN:
        required: false

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUD_MOCK_MODE: "true"
      CLOUD_PROVIDER: "local"
      GCP_PROJECT_ID: "test-project"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Fetch GH_PAT from Secret Manager
        id: gh_pat
        shell: bash
        run: |
          set -euo pipefail
          GH_PAT_VALUE=$(gcloud secrets versions access latest \
            --secret=GH_PAT --project=central-element-323112)
          if [ -z "${GH_PAT_VALUE}" ]; then
            echo "::error::GH_PAT empty when fetched from Secret Manager (projects/central-element-323112/secrets/GH_PAT)"
            exit 1
          fi
          # Mask before exposing so subsequent log lines never leak it
          echo "::add-mask::${GH_PAT_VALUE}"
          echo "gh_pat=${GH_PAT_VALUE}" >> "${GITHUB_OUTPUT}"

      - name: Clone unified-trading-pm
        shell: bash
        env:
          GH_PAT: ${{ steps.gh_pat.outputs.gh_pat }}
          DEP_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          BRANCH="${DEP_BRANCH:-main}"
          git clone --depth=1 -b "$BRANCH" \
            "https://x-access-token:${GH_PAT}@github.com/${GITHUB_REPOSITORY_OWNER}/unified-trading-pm.git" \
            ../unified-trading-pm \
            || git clone --depth=1 -b main \
              "https://x-access-token:${GH_PAT}@github.com/${GITHUB_REPOSITORY_OWNER}/unified-trading-pm.git" \
              ../unified-trading-pm

      - name: Install dependencies
        shell: bash
        run: npm ci

      - name: Run quality gates
        shell: bash
        run: |
          set -o pipefail
          bash scripts/quality-gates.sh --no-fix 2>&1 | tee /tmp/qg_output.log

      - name: Record CI status (branch-aware lifecycle)
        if: always()
        shell: bash
        env:
          GH_PAT: ${{ steps.gh_pat.outputs.gh_pat }}
          TRIGGER_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          [ -z "${GH_PAT}" ] && echo "GH_PAT not set — skipping ci-status-update" && exit 0

          if [ "${{ job.status }}" != "success" ]; then
            STATUS="FAILING"
          elif [ "$TRIGGER_BRANCH" = "staging" ]; then
            STATUS="STAGING_GREEN"
          else
            STATUS="FEATURE_GREEN"
          fi

          EXCERPT_B64=""
          if [ "${STATUS}" = "FAILING" ] && [ -f /tmp/qg_output.log ]; then
            EXCERPT_B64=$(sed 's/\x1b\[[0-9;]*[a-zA-Z]//g' /tmp/qg_output.log | tail -n 30 | head -c 1500 | base64 | tr -d '\n')
          fi

          echo "Recording ci_status=${STATUS} for ${GITHUB_REPOSITORY#*/} (branch=${TRIGGER_BRANCH})"
          curl -s -X POST \
            -H "Authorization: token ${GH_PAT}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY_OWNER}/unified-trading-pm/dispatches" \
            -d "{\"event_type\": \"ci-status-update\", \"client_payload\": {\"repo\": \"${GITHUB_REPOSITORY#*/}\", \"status\": \"${STATUS}\", \"branch\": \"${TRIGGER_BRANCH}\", \"sha\": \"${GITHUB_SHA}\", \"failure_excerpt_b64\": \"${EXCERPT_B64}\"}}"
