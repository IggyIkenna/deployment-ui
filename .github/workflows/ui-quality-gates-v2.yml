name: ui-quality-gates-v2

# Local reusable workflow (v2) — within-repo copy of the PM template.
# Cross-repo reusable workflow calls don't work between private user repos
# (only works in GitHub organizations). This local copy is the workaround.
# SSOT: IggyIkenna/unified-trading-pm/.github/workflows/ui-quality-gates.yml
#
# deployment-ui uses pnpm (pnpm-lock.yaml) as of 2026-07-29, NOT npm — mirroring
# unified-trading-system-ui's precedent divergence from the npm-based SSOT template
# (that repo's ui-quality-gates.yml carries the identical note). Use
# `pnpm install --frozen-lockfile` for deterministic installs. The internal
# scripts/quality-gates.sh -> base-ui.sh steps still invoke `npm run <script>` — that
# stays correct under pnpm too, since `npm run` only executes the package.json script
# entry via the local toolchain and doesn't care which tool populated node_modules.
#
# v2: identical to ui-quality-gates.yml EXCEPT the job id is `quality-gates-v2`
# (not `quality-gates`). This gives the v2 caller (quality-gates-v2.yml) a DISTINCT
# emitted check context `Quality Gates (deployment-ui) / quality-gates-v2`, matching
# the workspace-wide canonical required-check name (all other repos are on
# `…/quality-gates-v2`). It also decouples the v2 caller from the v1 workspace-qg.yml
# caller, which shares the old `ui-quality-gates.yml` (job `quality-gates`) — both
# callers previously emitted the identical `…/quality-gates` name (collision + the
# v1 ghost startup_failure poisoning that required context).

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version
        type: string
        default: "22"
    secrets:
      GH_PAT:
        required: false
      TELEGRAM_BOT_TOKEN:
        required: false

jobs:
  quality-gates-v2:
    # TEMPORARILY REVERTED to ubuntu-latest 2026-07-28 (~19:46 UTC): the shared orchestrator VM
    # (i-0c9b283b31d6b5ca7) is in an active, worsening capacity incident — load average hit 151.26,
    # swap essentially exhausted (272KB free of 15GB) — the SAME signature multiple other repos hit
    # this same day (strategy-service, execution-service, ibkr-gateway-infra — see
    # plans/active/issues/fleet_wide_qg_self_hosted_runner_capacity_crisis_2026_07_27.md), all fixed
    # with this exact precedented revert. Two self-hosted attempts here already failed on this same
    # contention (a 10min then a 25min job timeout, then a 300s internal typecheck-step timeout —
    # none were a config problem, the host genuinely could not complete the work in time). Re-attempt
    # self-hosted once that doc confirms the capacity incident has actually cleared, not on a fixed
    # schedule — this revert unblocks PR #440 now rather than waiting indefinitely on a worsening host.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUD_MOCK_MODE: "true"
      CLOUD_PROVIDER: "local"
      GCP_PROJECT_ID: "test-project"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "10"
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm

      - name: Clone unified-trading-pm
        shell: bash
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          DEP_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if [ -z "${GH_PAT}" ]; then
            echo "::warning::GH_PAT secret not configured in this repo — quality gates will fail."
            echo "  Add GH_PAT (a PAT with repo read scope) to this repo's GitHub Actions secrets."
            exit 0
          fi
          BRANCH="${DEP_BRANCH:-main}"
          git clone --depth=1 -b "$BRANCH" \
            "https://x-access-token:${GH_PAT}@github.com/${GITHUB_REPOSITORY_OWNER}/unified-trading-pm.git" \
            ../unified-trading-pm 2>/dev/null \
            || git clone --depth=1 -b main \
              "https://x-access-token:${GH_PAT}@github.com/${GITHUB_REPOSITORY_OWNER}/unified-trading-pm.git" \
              ../unified-trading-pm 2>/dev/null \
            || true

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Run quality gates
        shell: bash
        run: |
          set -o pipefail
          bash scripts/quality-gates.sh --no-fix 2>&1 | tee /tmp/qg_output.log

      - name: Compute codebase-health metrics (best-effort, non-fatal)
        id: codebase_health
        if: always()
        continue-on-error: true
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          python3 - <<'PYEOF' > .qg_codebase_health.json || echo '{}' > .qg_codebase_health.json
          import json, os
          _SKIP = {"node_modules", ".next", "build", "dist", ".git", ".venv"}
          large = warn = 0
          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d not in _SKIP]
              for f in files:
                  if not (f.endswith(".ts") or f.endswith(".tsx")):
                      continue
                  try:
                      n = open(os.path.join(root, f), "rb").read().count(b"\n")
                  except OSError:
                      continue
                  if n > 900:
                      large += 1
                  elif n >= 700:
                      warn += 1
          cov = None
          cov_path = "coverage/coverage-summary.json"
          if os.path.exists(cov_path):
              try:
                  data = json.load(open(cov_path, encoding="utf-8"))
                  total = data.get("total", {})
                  pct = (total.get("lines") or total.get("statements") or {}).get("pct")
                  if pct is not None:
                      cov = round(float(pct), 2)
              except (OSError, ValueError, KeyError):
                  pass
          reason = "qg" if os.environ.get("JOB_STATUS") not in ("success", None, "") else None
          print(json.dumps({"coverage_pct": cov, "qg_red_reason": reason, "large_file_count": large, "warn_file_count": warn}))
          PYEOF
          echo "codebase-health: $(cat .qg_codebase_health.json)"
          CH_B64=$(base64 -w0 < .qg_codebase_health.json 2>/dev/null || base64 < .qg_codebase_health.json | tr -d '\n')
          echo "ch_b64=${CH_B64}" >> "$GITHUB_OUTPUT"

      - name: Record CI status (branch-aware lifecycle)
        if: always()
        shell: bash
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          TRIGGER_BRANCH: ${{ github.head_ref || github.ref_name }}
          CH_B64: ${{ steps.codebase_health.outputs.ch_b64 }}
        run: |
          [ -z "${GH_PAT}" ] && echo "GH_PAT not set — skipping ci-status-update" && exit 0

          if [ "${{ job.status }}" != "success" ]; then
            STATUS="FAILING"
          elif [ "$TRIGGER_BRANCH" = "staging" ]; then
            STATUS="STAGING_GREEN"
          else
            STATUS="FEATURE_GREEN"
          fi

          EXCERPT_B64=""
          if [ "${STATUS}" = "FAILING" ] && [ -f /tmp/qg_output.log ]; then
            EXCERPT_B64=$(sed 's/\x1b\[[0-9;]*[a-zA-Z]//g' /tmp/qg_output.log | tail -n 30 | head -c 1500 | base64 | tr -d '\n')
          fi

          echo "Recording ci_status=${STATUS} for ${GITHUB_REPOSITORY#*/} (branch=${TRIGGER_BRANCH})"
          curl -s -X POST \
            -H "Authorization: token ${GH_PAT}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY_OWNER}/unified-trading-pm/dispatches" \
            -d "{\"event_type\": \"ci-status-update\", \"client_payload\": {\"repo\": \"${GITHUB_REPOSITORY#*/}\", \"status\": \"${STATUS}\", \"branch\": \"${TRIGGER_BRANCH}\", \"sha\": \"${GITHUB_SHA}\", \"failure_excerpt_b64\": \"${EXCERPT_B64}\", \"codebase_health_b64\": \"${CH_B64:-}\"}}"
