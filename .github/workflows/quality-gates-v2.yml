# quality-gates-v2.yml — deployment-ui UI quality gates (v2, escapes GHA ghost cache)
#
# DESIGN: This is the v2 caller for the UI quality-gate reusable workflow.
# deployment-ui is a TypeScript/Vite repo — NOT a Python service. The Python
# template (python-quality-gates-v2.yml) runs `uv sync --frozen` which requires
# a pyproject.toml — it fails immediately for this repo. This file must stay
# pointing at ui-quality-gates-v2.yml (the local reusable, node/npm-based gate).
#
# ROLLOUT GUARD: rollout-workflow-templates.sh applies the Python template to all
# repos — it does NOT know deployment-ui is a UI repo. If that script overwrites
# this file, revert it back to this form. The correct template caller is
# ./.github/workflows/ui-quality-gates-v2.yml.
#
# The job key "quality-gates-v2" registers a fresh GHA check context that bypasses
# the ghost cache on the old "quality-gates" / "Quality Gates" context (Option D).
#
# Authentication: GH_PAT is passed directly as a secret (deployment-ui has GH_PAT
# as a GHA secret). The inner ui-quality-gates-v2.yml accepts GH_PAT as optional —
# if absent, the PM clone step is skipped with a warning (quality gates still run).
#
# Trigger surface:
#   push to [main] + pull_request to [main, staging] + workflow_dispatch

name: quality-gates-v2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

# Concurrency: cancel in-progress runs for the same ref on new push (saves Action minutes).
# PR runs serialize per-PR.
concurrency:
  group: quality-gates-v2-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  quality-gates-v2:
    name: Quality Gates (deployment-ui)
    uses: ./.github/workflows/ui-quality-gates-v2.yml
    with:
      node-version: "22"
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

  # Escalate a FAILED promotion-gate run to the orchestrator (event-driven LDR-QG-failure escalation).
  # When quality-gates-v2 FAILS on an LDR→staging / LDR→main promotion PR, the deterministic CI/CD
  # pipeline has hit a JUDGMENT wall it cannot fix itself (the promote PR is now red + blocked). Hand
  # it to the agent-orchestrator via the canonical escalate-to-orchestrator.yml reusable workflow
  # (repository_dispatch into PM, which owns that workflow), with wall_type=ldr_qg_failure — the
  # orchestrator already recognises this wall (server/escalation.py WALL_TYPES) and spawns a $0-API
  # setup-token worker that fixes the gate on live-defi-rollout and pings the authoring slot.
  # Best-effort: a notify failure must NEVER fail the build further (the gate already failed). SSOT:
  #   orchestrator_master.md (item P2 "event-driven LDR-QG-failure escalation") +
  #   server/escalation.py + .github/workflows/escalate-to-orchestrator.yml (in unified-trading-pm).
  escalate-ldr-qg-failure:
    name: Escalate LDR-QG failure to orchestrator (promotion PR only)
    needs: quality-gates-v2
    # Fire ONLY when (a) the gate FAILED, (b) this is a pull_request run, and (c) the PR targets a
    # promotion branch (staging or main) — i.e. an LDR→staging / →main promotion gate. A PR into any
    # other base, a push run, or a green gate never escalates. `always()` so the `failure()` of the
    # needed job doesn't also skip THIS job.
    if: >-
      always() && needs.quality-gates-v2.result == 'failure'
      && github.event_name == 'pull_request'
      && (github.base_ref == 'staging' || github.base_ref == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch escalate-to-orchestrator (ldr_qg_failure → orchestrator worker)
        env:
          # MUST be GH_PAT: a repository_dispatch fired with the default GITHUB_TOKEN does NOT trigger
          # workflows (so escalate-to-orchestrator.yml in PM would never fire). GH_PAT also carries the
          # cross-repo scope needed to dispatch into unified-trading-pm from a service repo.
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GH_ORG: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # `|| true` on the step (and set +e) → a dispatch failure (missing PAT, API hiccup) is logged
        # but never reddens the run; the gate's own failure remains the actionable signal.
        run: |
          set +e
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "[escalate] no GH_PAT — cannot dispatch escalate-to-orchestrator; skipping (gate failure stands)."
            exit 0
          fi
          CTX="quality-gates-v2 FAILED on promotion PR ${REPO}#${PR_NUMBER} (LDR -> ${BASE_REF}). The promote gate is red + the PR is blocked. Fix the gate failure ON live-defi-rollout (re-run the failing quality-gates.sh leg locally, fix root cause, ship via quickmerge), then the promotion re-gates green. Failing run: ${RUN_URL}"
          # repository_dispatch into unified-trading-pm (it owns escalate-to-orchestrator.yml), exactly
          # like the dispatch-cloud-build step targets PM's cloud-build-router. client_payload mirrors
          # the escalate-to-orchestrator inputs (server/models/escalation.py EscalateRequest).
          gh api "repos/${GH_ORG}/unified-trading-pm/dispatches" \
            -f event_type=escalate-to-orchestrator \
            -f "client_payload[repo]=${REPO}" \
            -f "client_payload[pr_number]=${PR_NUMBER}" \
            -f 'client_payload[wall_type]=ldr_qg_failure' \
            -f "client_payload[context]=${CTX}" \
            -f 'client_payload[authoring_slot]=ci' \
            -f 'client_payload[model]=sonnet' \
            && echo "[escalate] dispatched ldr_qg_failure for ${REPO}#${PR_NUMBER} -> orchestrator (via PM escalate-to-orchestrator)." \
            || echo "[escalate] repository_dispatch failed (best-effort) — gate failure stands; check GH_PAT / PM dispatch perms."
          exit 0

  # Dispatch qg-passed to PM cloud-build-router on staging merge so Cloud Build runs the image build.
  # cloud-build-router.yml in PM listens for this event and triggers the GCP Cloud Build pipeline.
  dispatch-cloud-build:
    name: Dispatch cloud-build trigger (staging only)
    needs: quality-gates-v2
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch qg-passed → cloud-build-router
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GH_ORG: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Trigger cloud-build-router.yml in unified-trading-pm via repository_dispatch qg-passed
          curl -s -X POST \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${GH_ORG}/unified-trading-pm/dispatches" \
            -d "{\"event_type\": \"qg-passed\", \"client_payload\": {\"repo\": \"${REPO}\", \"branch\": \"${BRANCH}\", \"commit_sha\": \"${COMMIT_SHA}\", \"repo_type\": \"ui\"}}"
          echo "Dispatched qg-passed for ${REPO}@${COMMIT_SHA} on ${BRANCH}"
