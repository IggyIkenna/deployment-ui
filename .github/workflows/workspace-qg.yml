# workspace-qg.yml — UNIFIED quality-gates workflow template (replaces per-repo quality-gates.yml)
#
# DESIGN (opus-max-tier 2026-05-16; supersedes slot 8's first pass that omitted live-defi-rollout):
#
# ## Trigger surface — covers all 5 patterns observed across 21 Python repos as of 2026-05-15:
#
#  - 9 repos triggered on `[main, staging, live-defi-rollout]` push (fires hundreds/day on LDR)
#  - 9 repos triggered on `[main]` only (slow cadence)
#  - 2 repos triggered on `[main, staging]`
#  - 1 repo triggered on `[main, develop]` (position-balance-monitor — stale 'develop' branch)
#
# This unified template fires on `push to [main, staging, live-defi-rollout]` + `pull_request to
# [main, staging]` — strict superset of all current triggers. Repos on the `[main]`-only pattern
# will see additional QG runs on LDR pushes after migration. That's the intended unification.
#
# ## Post-cutover migration (2026-05-23):
#
# After cutover, `live-defi-rollout` branch is retired. Update the template to:
#
#   push:
#     branches: [main, staging]
#   pull_request:
#     branches: [main, staging]
#
# Then roll out via `bash scripts/workflow-templates/rollout-workflow-templates.sh`. Document the
# transition in `codex/08-workflows/ci-cd-flow.md` § "Post-cutover workflow trigger surface".
#
# ## Why this lives in PM (not per-repo):
#
# - Single SSOT — drift between repos previously caused 5 distinct trigger patterns.
# - `dep_repos` rendered from `workspace-manifest.json` (canonical) — eliminates hand-crafted
#   phantom-dep lists (alerting-service's stale `unified-cloud-interface` / `unified-config-interface` /
#   `unified-internal-contracts` references will be auto-corrected by next rollout).
# - Roll forward: edit template + `rollout-workflow-templates.sh` propagates to all 21 repos in one
#   pass.
#
# ## Substitution placeholders:
#
# - `` — rendered from workspace-manifest.json by rollout-workflow-templates.sh
# - `deployment-ui` — repo name (e.g. alerting-service)
# - `deployment_ui` — Python source dir (e.g. alerting_service)

name: workspace-qg

on:
  push:
    branches: [main, staging, live-defi-rollout]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

# Concurrency: cancel in-progress runs for the same ref on new push (saves Action minutes during
# rapid LDR push cadence). PR runs serialize per-PR.
concurrency:
  group: workspace-qg-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  quality-gates:
    name: Quality Gates (deployment-ui)
    # 2026-05-28 fix (Item 14 of human_work_backlog_2026_05_20.md): deployment-ui is a
    # TypeScript/React repo — calling the Python QG template (python-quality-gates.yml) was the
    # original bug. Plus the cross-repo reusable-workflow call to PM doesn't work for private
    # user repos and inheriting secrets fails because deployment-ui doesn't have GH_PAT in its
    # GHA secrets (operator policy: GH_PAT lives in GCP Secret Manager, not GHA secrets).
    #
    # Switch to the within-repo local copy `ui-quality-gates.yml` which authenticates to GCP via
    # GCP_SA_KEY (which IS a GHA secret) and fetches GH_PAT from Secret Manager at workflow
    # runtime. See ui-quality-gates.yml § "Authenticate to GCP" + "Fetch GH_PAT from Secret
    # Manager" steps.
    uses: ./.github/workflows/ui-quality-gates.yml
    secrets:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

  # Dispatch qg-passed to PM cloud-build-router on staging merge so Cloud Build runs the image build.
  # cloud-build-router.yml in PM listens for this event and triggers the GCP Cloud Build pipeline.
  dispatch-cloud-build:
    name: Dispatch cloud-build trigger (staging only)
    needs: quality-gates
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Fetch GH_PAT from Secret Manager
        id: gh_pat
        run: |
          set -euo pipefail
          GH_PAT_VALUE=$(gcloud secrets versions access latest \
            --secret=GH_PAT --project=central-element-323112)
          if [ -z "${GH_PAT_VALUE}" ]; then
            echo "::error::GH_PAT empty when fetched from Secret Manager (projects/central-element-323112/secrets/GH_PAT)"
            exit 1
          fi
          # Mask + expose via $GITHUB_OUTPUT; mask first so subsequent log lines don't leak it
          echo "::add-mask::${GH_PAT_VALUE}"
          echo "gh_pat=${GH_PAT_VALUE}" >> "${GITHUB_OUTPUT}"

      - name: Dispatch qg-passed → cloud-build-router
        env:
          GH_TOKEN: ${{ steps.gh_pat.outputs.gh_pat }}
          GH_ORG: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Trigger cloud-build-router.yml in unified-trading-pm via repository_dispatch qg-passed
          curl -s -X POST \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${GH_ORG}/unified-trading-pm/dispatches" \
            -d "{\"event_type\": \"qg-passed\", \"client_payload\": {\"repo\": \"${REPO}\", \"branch\": \"${BRANCH}\", \"commit_sha\": \"${COMMIT_SHA}\", \"repo_type\": \"service\"}}"
          echo "Dispatched qg-passed for ${REPO}@${COMMIT_SHA} on ${BRANCH}"
